[package]
name = "filament-mltl"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Bridges tl-mltl's TL-owned evaluation types to filament-observation's owner-assertion views. The one deliberate exception to tl-mltl's independence from the Filament ecosystem."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-mltl"
publish = false

[workspace]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

[lib]
name = "filament_mltl"
path = "src/lib.rs"

[dependencies]
tl-mltl = { version = "=0.4.1", git = "https://github.com/agent-ix/tl-mltl", rev = "06cda7776a3566ae90e223c3bc286c254618d39a" }
filament-observation = { version = "=0.1.1", git = "https://github.com/agent-ix/filament-observation", rev = "6e0524170e83c6fae0c35a404592cd3cae24252f" }
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "9f7b1c868df605cb6e885291db95a948cd08829c", default-features = false, features = ["alloc", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"

[dev-dependencies]
ix-trace-rs = { version = "0.1", git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }

[profile.release]
lto = "thin"
codegen-units = 1
